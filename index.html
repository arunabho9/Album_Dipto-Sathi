<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dipto &amp; Sathi — Keepsake Album</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-w: min(43vw, 430px);
      --page-h: min(74vh, 595px);
      --cover-overhang-x: 11px;
      --cover-overhang-y: 12px;
      --leather-base: #4a0e1b;
      --leather-dark: #25050c;
      --paper-cream: #fcf8f0;
      --paper-warm: #f6efe0;
      --ink-sepia: #292524;
    }

    @media (max-width: 640px) {
      :root {
        --page-w: 44vw;
        --page-h: min(68vh, 490px);
        --cover-overhang-x: 8px;
        --cover-overhang-y: 9px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #140b0e;
      color: var(--ink-sepia);
      user-select: none;
    }

    .font-serif-editorial { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-handwriting { font-family: 'Caveat', cursive; }
    .font-calligraphy { font-family: 'Alex Brush', cursive; }

    /* Warm Ambient Wooden Table Backdrop */
    .desk-scene {
      width: 100%;
      height: 100svh;
      perspective: 2200px;
      transform-style: preserve-3d;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding-top: 42px;
      background:
        radial-gradient(circle at 50% 48%, rgba(253, 224, 171, 0.13) 0%, rgba(12, 6, 8, 0.86) 76%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 14px),
        linear-gradient(135deg, #2b1815 0%, #1a0d10 50%, #0f0709 100%);
      touch-action: none;
    }

    /* Book Stage: Shifts horizontally between Closed Cover, Open Book, and Closed Back Cover */
    .book-stage {
      position: relative;
      width: var(--page-w);
      height: var(--page-h);
      transform-style: preserve-3d;
      --spine-x: 0px;
      transform: translateX(var(--spine-x));
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 28px 36px rgba(0, 0, 0, 0.75)) drop-shadow(0 10px 14px rgba(0, 0, 0, 0.5));
    }

    /* Book-Block Side Thickness Edges (visible stack of cream pages) */
    .page-block-edge-right {
      position: absolute;
      top: 2px;
      bottom: 2px;
      right: -7px;
      width: 7px;
      background: repeating-linear-gradient(
        90deg,
        #f2ead9 0px,
        #ded2ba 1px,
        #faf4e8 2px
      );
      border-radius: 0 3px 3px 0;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.22);
      transform: translateZ(-2px);
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .page-block-edge-left {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: -7px;
      width: 7px;
      background: repeating-linear-gradient(
        90deg,
        #faf4e8 0px,
        #ded2ba 1px,
        #f2ead9 2px
      );
      border-radius: 3px 0 0 3px;
      box-shadow: inset 2px 0 4px rgba(0,0,0,0.22);
      transform: translateZ(-2px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    /* Individual Turning Leaf (Cover Boards + Paper Sheets) */
    .book-leaf {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--page-w);
      height: var(--page-h);
      transform-style: preserve-3d;
      transform-origin: 0% 50%;
      will-change: transform;
      contain: layout style;
      cursor: grab;
    }
    .book-leaf.is-dragging {
      cursor: grabbing;
    }

    /* Rigid Hardcover Boards (No bending/rolling—pure 3D rotateY board flip) */
    .book-leaf--board {
      top: calc(-1 * var(--cover-overhang-y));
      height: calc(var(--page-h) + (var(--cover-overhang-y) * 2));
      width: calc(var(--page-w) + var(--cover-overhang-x));
    }

    /* Front & Back Faces of any leaf */
    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .leaf-face--front {
      transform: translateZ(0.4px);
    }

    .leaf-face--back {
      transform: rotateY(180deg) translateZ(0.4px);
    }

    /* Burgundy Leather Exterior */
    .leather-exterior {
      background-color: var(--leather-base);
      background-image:
        radial-gradient(circle at 28% 20%, rgba(255, 224, 178, 0.14), transparent 55%),
        radial-gradient(rgba(0, 0, 0, 0.32) 1px, transparent 0),
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
        linear-gradient(145deg, #5a1222 0%, #3b0914 60%, #24040b 100%);
      background-size: 100% 100%, 5px 5px, 7px 7px, 100% 100%;
      background-position: 0 0, 0 0, 2px 3px, 0 0;
      box-shadow:
        inset 16px 0 26px rgba(0, 0, 0, 0.58),
        inset 3px 0 3px rgba(255, 255, 255, 0.14),
        inset -2px 0 4px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1.5px rgba(235, 198, 128, 0.38);
    }

    .leather-exterior--front {
      border-radius: 3px 12px 12px 3px;
    }

    .leather-exterior--back {
      border-radius: 12px 3px 3px 12px;
      box-shadow:
        inset -16px 0 26px rgba(0, 0, 0, 0.58),
        inset -3px 0 3px rgba(255, 255, 255, 0.14),
        inset 2px 0 4px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1.5px rgba(235, 198, 128, 0.38);
    }

    /* Inside Hardcover Board */
    .hardcover-inside-left {
      border-radius: 11px 3px 3px 11px;
      background-color: #360812;
      background-image:
        radial-gradient(rgba(235, 198, 128, 0.08) 1px, transparent 0),
        linear-gradient(270deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.12) 12%, rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.28) 100%);
      background-size: 9px 9px, 100% 100%;
      box-shadow:
        inset -18px 0 26px rgba(0, 0, 0, 0.65),
        inset 0 0 0 10px #4a0e1b,
        inset 0 0 0 11px rgba(235, 198, 128, 0.34);
      padding: 18px;
    }

    .hardcover-inside-right {
      border-radius: 3px 11px 11px 3px;
      background-color: #360812;
      background-image:
        radial-gradient(rgba(235, 198, 128, 0.08) 1px, transparent 0),
        linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.12) 12%, rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.28) 100%);
      background-size: 9px 9px, 100% 100%;
      box-shadow:
        inset 18px 0 26px rgba(0, 0, 0, 0.65),
        inset 0 0 0 10px #4a0e1b,
        inset 0 0 0 11px rgba(235, 198, 128, 0.34);
      padding: 18px;
    }

    /* Paste-Down Textured Cream Endpaper Inside the Hardcover */
    .endpaper-sheet {
      width: 100%;
      height: 100%;
      background-color: #f6efe0;
      background-image:
        repeating-linear-gradient(45deg, rgba(130, 102, 72, 0.04) 0px, rgba(130, 102, 72, 0.04) 1px, transparent 1px, transparent 6px),
        repeating-linear-gradient(-45deg, rgba(130, 102, 72, 0.04) 0px, rgba(130, 102, 72, 0.04) 1px, transparent 1px, transparent 6px);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(180, 142, 92, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      position: relative;
    }

    /* Gold-Foil Cover Stamping */
    .gold-stamp {
      background: linear-gradient(135deg, #fbe8b6 0%, #d4a64e 38%, #fff1c7 55%, #b3822c 85%, #ebd089 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.75));
    }

    .cover-deboss-border {
      position: absolute;
      inset: 14px;
      border: 1.5px solid rgba(235, 198, 128, 0.48);
      border-radius: 2px 9px 9px 2px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(90deg, rgba(0,0,0,0.6), rgba(255,255,255,0.09), rgba(0,0,0,0.5));
      pointer-events: none;
    }

    /* Warm Cream Cotton-Rag Paper Faces */
    .paper-right {
      border-radius: 2px 8px 8px 2px;
      background-color: var(--paper-cream);
      background-image:
        radial-gradient(rgba(120, 96, 72, 0.06) 1px, transparent 0),
        linear-gradient(90deg, rgba(28, 16, 8, 0.22) 0%, rgba(28, 16, 8, 0.04) 6%, rgba(255, 255, 255, 0.4) 18%, rgba(244, 234, 214, 0.3) 100%);
      background-size: 12px 12px, 100% 100%;
      box-shadow:
        inset 16px 0 22px -12px rgba(38, 22, 10, 0.3),
        1px 0 2px rgba(0, 0, 0, 0.12);
    }

    .paper-left {
      border-radius: 8px 2px 2px 8px;
      background-color: var(--paper-cream);
      background-image:
        radial-gradient(rgba(120, 96, 72, 0.06) 1px, transparent 0),
        linear-gradient(270deg, rgba(28, 16, 8, 0.22) 0%, rgba(28, 16, 8, 0.04) 6%, rgba(255, 255, 255, 0.4) 18%, rgba(244, 234, 214, 0.3) 100%);
      background-size: 12px 12px, 100% 100%;
      box-shadow:
        inset -16px 0 22px -12px rgba(38, 22, 10, 0.3),
        -1px 0 2px rgba(0, 0, 0, 0.12);
    }

    /* Multi-Strip Paper Roll Layer */
    .paper-roll-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 60;
      display: none;
    }

    .paper-roll-strip {
      position: absolute;
      top: 0;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: 0% 50%;
      will-change: transform;
      contain: layout style;
    }

    .paper-roll-strip-front,
    .paper-roll-strip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .paper-roll-strip-back {
      transform: rotateY(180deg) translateZ(0.3px);
    }

    .paper-roll-strip-inner {
      position: absolute;
      top: 0;
      height: 100%;
    }

    .paper-roll-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    /* Polaroid Photo & Video Prints */
    .polaroid-card {
      background: #ffffff;
      padding: 4px 4px 7px 4px;
      border-radius: 2px;
      box-shadow: 0 3px 7px rgba(42, 28, 18, 0.2), 0 1px 2px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .polaroid-card:hover {
      transform: scale(1.03) rotate(0deg) !important;
      z-index: 25;
      box-shadow: 0 8px 18px rgba(36, 20, 12, 0.28);
    }

    /* Subtle Translucent Washi Tape on Locked Memories */
    .washi-tape {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 38px;
      height: 11px;
      background: linear-gradient(90deg, rgba(244, 182, 194, 0.55), rgba(251, 218, 224, 0.65), rgba(244, 182, 194, 0.55));
      border-left: 1px dashed rgba(190, 110, 125, 0.35);
      border-right: 1px dashed rgba(190, 110, 125, 0.35);
      pointer-events: none;
      z-index: 5;
    }

    /* Romantic Days & Milestone Counter Box on Inside Front Cover */
    .milestone-box {
      width: 100%;
      max-width: 215px;
      background: linear-gradient(145deg, rgba(110, 18, 38, 0.08), rgba(180, 134, 72, 0.14));
      border: 1px solid rgba(136, 28, 48, 0.28);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 3px 10px rgba(68, 28, 18, 0.08);
    }

    .caption-input {
      width: 100%;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-size: 13px;
      line-height: 1.15;
      color: #443832;
      background: transparent;
      border: none;
      outline: none;
      margin-top: 3px;
      user-select: text;
      -webkit-user-select: text;
    }
    .caption-input::placeholder {
      color: #a8998c;
      font-style: italic;
    }

    /* "On This Day" Golden Flashback Shimmer for Contents Entry */
    @keyframes onThisDayGlow {
      0%, 100% { background-color: rgba(253, 230, 138, 0.35); box-shadow: 0 0 8px rgba(245, 158, 11, 0.25); }
      50% { background-color: rgba(253, 230, 138, 0.85); box-shadow: 0 0 16px rgba(245, 158, 11, 0.55); }
    }
    .on-this-day-shimmer {
      animation: onThisDayGlow 2.4s ease-in-out infinite;
      border-radius: 4px;
      padding-left: 4px;
      padding-right: 4px;
    }

    /* Secret Love Note Envelope Pocket on Inside Back Cover */
    .love-envelope-pocket {
      position: relative;
      width: 92%;
      max-width: 265px;
      height: 152px;
      background: linear-gradient(160deg, #efe3cc 0%, #e1cda9 100%);
      border: 1.5px solid rgba(154, 114, 72, 0.52);
      border-radius: 6px 6px 12px 12px;
      box-shadow: 0 8px 18px rgba(48, 22, 12, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: visible;
    }
    .love-envelope-pocket:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(48, 22, 12, 0.28);
    }
    .love-envelope-body-front {
      position: absolute;
      inset: 0;
      border-radius: 6px 6px 12px 12px;
      background:
        linear-gradient(32deg, rgba(223, 200, 162, 0.95) 49%, transparent 50.5%),
        linear-gradient(328deg, rgba(215, 190, 150, 0.95) 49%, transparent 50.5%),
        linear-gradient(180deg, transparent 35%, #e6d3b1 100%);
      z-index: 4;
      pointer-events: none;
    }
    .love-envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 82px;
      background: linear-gradient(180deg, #d7be94 0%, #ead7b7 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      transform-origin: top center;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), z-index 0s 0.2s;
      z-index: 6;
    }
    .love-envelope-seal {
      position: absolute;
      top: 66px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, #9f1239, #4c0519);
      border: 1.5px solid rgba(253, 224, 171, 0.7);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fde68a;
      font-size: 11px;
      z-index: 7;
      transition: opacity 0.25s ease, transform 0.3s ease;
    }
    .love-envelope-letter-card {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      height: 122px;
      background: linear-gradient(180deg, #fffef9 0%, #fbf3e4 100%);
      border: 1px solid rgba(180, 142, 92, 0.55);
      border-radius: 5px;
      box-shadow: 0 6px 16px rgba(42, 16, 12, 0.24);
      transform: translateY(0px) translateZ(0px) scale(0.95);
      opacity: 0;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.14s, opacity 0.25s ease 0.12s, box-shadow 0.4s ease 0.25s;
      z-index: 3;
      padding: 8px 10px;
      cursor: zoom-in;
    }
    .love-envelope-pocket.is-open .love-envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .love-envelope-pocket.is-open .love-envelope-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.6);
      pointer-events: none;
    }
    .love-envelope-pocket.is-open .love-envelope-letter-card {
      transform: translateY(-34px) translateZ(18px) scale(1.04);
      opacity: 1;
      z-index: 12;
      box-shadow: 0 14px 26px rgba(36, 12, 10, 0.34);
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: 0.65; }
    }
    .recording-dot {
      animation: micPulse 1s ease-in-out infinite;
    }

    .photo-corner {
      position: absolute;
      width: 11px;
      height: 11px;
      border-color: rgba(145, 114, 78, 0.55);
      pointer-events: none;
    }

    /* Heart Celebration Pop-up Animation */
    @keyframes heartFloatPop {
      0% { opacity: 0; transform: translate(-50%, -42%) scale(0.4); filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.4)); }
      25% { opacity: 1; transform: translate(-50%, -50%) scale(1.14); filter: drop-shadow(0 0 38px rgba(251, 113, 133, 1)) drop-shadow(0 0 70px rgba(244, 63, 94, 0.95)); }
      75% { opacity: 1; transform: translate(-50%, -52%) scale(1.02); filter: drop-shadow(0 0 32px rgba(251, 113, 133, 0.95)) drop-shadow(0 0 60px rgba(244, 63, 94, 0.85)); }
      100% { opacity: 0; transform: translate(-50%, -62%) scale(0.92); filter: drop-shadow(0 0 12px rgba(251, 113, 133, 0)); }
    }
    .heart-celebration-active {
      animation: heartFloatPop 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Fountain-Pen Ruled Lines */
    .journal-lines {
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 21px,
        rgba(140, 114, 88, 0.22) 22px
      );
      line-height: 22px;
    }

    .journal-textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Caveat', cursive;
      font-size: clamp(16px, 1.6vw, 19px);
      line-height: 22px;
      padding: 0 3px;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Masonry Collage Layout */
    .polaroid-masonry {
      column-count: 2;
      column-gap: 10px;
      width: 100%;
    }
    .polaroid-masonry.single-item {
      column-count: 1;
    }
    .polaroid-masonry .polaroid-card {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      display: inline-block;
      width: 100%;
      margin-bottom: 10px;
    }
    .journal-textarea::placeholder {
      opacity: 0.42;
      font-style: italic;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(120, 28, 46, 0.3);
      outline: none;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      color: #29201b;
      user-select: text;
      -webkit-user-select: text;
    }
    .title-input:focus {
      border-bottom-color: #6e1929;
    }

    .thin-scroll::-webkit-scrollbar { width: 4px; }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: rgba(135, 108, 82, 0.35);
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <!-- Discreet Top Sound Control -->
  <header class="fixed top-0 right-0 z-50 flex items-center justify-end px-3 sm:px-6 py-2.5 pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-2">
      <!-- Paper Turn Sound & Music Toggle -->
      <button id="sound-toggle" title="Toggle Sound & Music" class="w-9 h-9 rounded-full bg-black/50 hover:bg-black/70 backdrop-blur-md border border-amber-200/15 text-amber-100/90 flex items-center justify-center transition shadow-lg">
        <svg id="sound-icon-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
        </svg>
        <svg id="sound-icon-off" class="w-4 h-4 hidden text-amber-100/45" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Ambient Background Music Track -->
  <audio id="bg-music-audio" src="bg-music.mp3" loop preload="auto"></audio>

  <!-- Main Desk & 3D Hardcover Album -->
  <main class="desk-scene" id="desk-scene">
    <div class="book-stage" id="book-stage">
      <div class="page-block-edge-left" id="edge-left"></div>
      <div class="page-block-edge-right" id="edge-right"></div>
    </div>
  </main>

  <!-- Bright Big Heart Pop-up (+1 Memory) -->
  <div id="heart-celebration" class="fixed top-1/2 left-1/2 z-50 pointer-events-none hidden">
    <div class="relative flex items-center justify-center w-44 h-44 sm:w-52 sm:h-52">
      <div class="absolute inset-4 rounded-full bg-rose-400/55 blur-2xl"></div>

  <script>
    const STORAGE_KEY = 'dipto_sathi_album_github_v2';

    const IDB_NAME = 'DiptoSathiMemoryDB';
    const IDB_STORE = 'album_store';
    const IDB_VERSION = 1;
    const CONTENTS_PER_PAGE = 9;

    // Pre-configured GitHub Repo Sync Details (Fill in when ready)
    const GITHUB_SYNC_CONFIG = {
      repo: 'arunabho9/Album_Dipto-Sathi',
      branch: 'main',
      path: 'album-data.json',
      token: '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'
    };

    let config = {

    let secretLoveNote = "Amar priyo Sathi,\n\nEi chhoto boita banalam shudhu amader prottekta muhurto ke jotno kore rakhbo bole. Jibone onek kichhu bodle jabe, somoy chole jabe, kintu ei patagulote amader hashi, golpo, ar ekshathe thakar onubhutigulo chirodin thakbe.\n\nTumi amar shobcheye sundor ovvesh, amar shanti, ar amar prottekta diner shobcheye bhalo onsho. Tumi pashe thakle shadharon din-o oshadharon hoye jay. Prottekta monthsary, prottekta bochor amra evabei ekshathe notun notun smriti ei boitar patay joma korbo.\n\nAmi tomake khub bhalobashi, ajke, kal, ar chirokal.\n\nShudhu tomar,\nDipto ♥";

    let memories = [
      {
        title: "",
        date: "",
        sathi: "",
        dipto: "",
        media: [],
        locked: false
      }
    ];

    // Asynchronous IndexedDB Engine & ObjectURL Cache for Zero-Lag Binary Media
    let dbPromise = null;
    const blobUrlCache = new WeakMap();

    function openAlbumDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unsupported'));
          return;
        }
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    async function idbGet(key) {
      const db = await openAlbumDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbSet(key, val) {
      const db = await openAlbumDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(val, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function dataUrlToBlob(dataUrl) {
      if (typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return null;
      try {
        const commaIdx = dataUrl.indexOf(',');
        const header = dataUrl.slice(5, commaIdx);
        const mimeType = header.split(';')[0] || 'application/octet-stream';
        const bin = atob(dataUrl.slice(commaIdx + 1));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new Blob([bytes], { type: mimeType });
      } catch (_) {
        return null;
      }
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    function getMediaObjectUrl(item) {
      if (!item) return '';
      if (item.blob instanceof Blob) {
        let cached = blobUrlCache.get(item.blob);
        if (!cached) {
          cached = URL.createObjectURL(item.blob);
          blobUrlCache.set(item.blob, cached);
        }
        return cached;
      }
      return item.src || '';
    }

    function normalizeMediaItemsForIDB(memList) {
      if (!Array.isArray(memList)) return;
      for (const mem of memList) {
        if (!Array.isArray(mem.media)) {
          mem.media = [];
          continue;
        }
        for (let i = 0; i < mem.media.length; i++) {
          const item = mem.media[i];
          if (!(item.blob instanceof Blob) && typeof item.src === 'string' && item.src.startsWith('data:')) {
            const converted = dataUrlToBlob(item.src);
            if (converted) {
              item.blob = converted;
              item.mimeType = converted.type;
              delete item.src;
            }
          }
        }
      }
    }

    async function loadAlbumFromStorage() {
      try {
        // 1. One-time seamless migration from legacy localStorage if present
        const legacyMemRaw = localStorage.getItem(STORAGE_KEY);
        const legacyNoteRaw = localStorage.getItem(LOVE_NOTE_KEY);
        if (legacyMemRaw) {
          const parsedMem = JSON.parse(legacyMemRaw);
          if (Array.isArray(parsedMem) && parsedMem.length > 0) {
            normalizeMediaItemsForIDB(parsedMem);
            memories = parsedMem;
            await idbSet(STORAGE_KEY, memories);
          }
          localStorage.removeItem(STORAGE_KEY);
        } else {
          const idbMem = await idbGet(STORAGE_KEY);
          if (Array.isArray(idbMem) && idbMem.length > 0) {
            normalizeMediaItemsForIDB(idbMem);
            memories = idbMem;
          }
        }

        if (typeof legacyNoteRaw === 'string' && legacyNoteRaw.trim()) {
          secretLoveNote = legacyNoteRaw;
          await idbSet(LOVE_NOTE_KEY, secretLoveNote);
          localStorage.removeItem(LOVE_NOTE_KEY);
        } else {
          const idbNote = await idbGet(LOVE_NOTE_KEY);
          if (typeof idbNote === 'string' && idbNote.trim()) {
            secretLoveNote = idbNote;
          }
        }
      } catch (_) {}
    }

    let ghLastSha = null;
    let isGhSyncing = false;
    let isEnvelopeOpen = false;

    function isGitHubConfigured() {
      return Boolean(
        GITHUB_SYNC_CONFIG.repo &&
        GITHUB_SYNC_CONFIG.repo.includes('/') &&
        GITHUB_SYNC_CONFIG.token &&
        GITHUB_SYNC_CONFIG.path
      );
    }

    function getActiveGitHubToken() {
      return (GITHUB_SYNC_CONFIG.token || '').trim();
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const bin = atob(b64.replace(/\s/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let bin = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(bin);
    }

    function getExtensionFromMime(mimeType, mediaType) {
      const m = (mimeType || '').toLowerCase();
      if (m.includes('png')) return 'png';
      if (m.includes('webp')) return 'webp';
      if (m.includes('gif')) return 'gif';
      if (m.includes('mp4')) return 'mp4';
      if (m.includes('quicktime') || m.includes('mov')) return 'mov';
      if (m.includes('ogg')) return 'ogg';
      if (m.includes('mp3') || m.includes('mpeg')) return 'mp3';
      if (m.includes('wav')) return 'wav';
      if (mediaType === 'video') return 'mp4';
      if (mediaType === 'audio') return 'webm';
      return 'jpg';
    }

    async function uploadMediaFileToGitHub(repoPath, blob) {
      const repo = GITHUB_SYNC_CONFIG.repo.trim();
      const branch = (GITHUB_SYNC_CONFIG.branch || 'main').trim();
      const token = getActiveGitHubToken();
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${repoPath}`;

      let existingSha = null;
      const headRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json'
        }
      });
      if (headRes.ok) {
        const headJson = await headRes.json();
        existingSha = headJson.sha || null;
      }

      const buf = await blob.arrayBuffer();
      const body = {
        message: `Add memory asset ${repoPath}`,
        content: arrayBufferToBase64(buf),
        branch
      };
      if (existingSha) body.sha = existingSha;

      const putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!putRes.ok) {
        throw new Error(`Asset upload failed (${putRes.status})`);
      }
      return repoPath;
    }

    async function fetchMediaBlobFromGitHub(repoPath) {
      const repo = GITHUB_SYNC_CONFIG.repo.trim();
      const branch = (GITHUB_SYNC_CONFIG.branch || 'main').trim();
      const token = getActiveGitHubToken();
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${repoPath}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(apiUrl, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.raw'
        }
      });
      if (!res.ok) return null;
      return await res.blob();
    }

    async function serializeMemoriesForGitHub(memList) {
      const out = [];
      for (let mIdx = 0; mIdx < memList.length; mIdx++) {
        const mem = memList[mIdx];
        const memoryFolder = `assets/memories/memory-${mIdx + 1}`;
        const mediaOut = [];

        if (Array.isArray(mem.media)) {
          const counters = { photo: 0, video: 0, voice: 0 };
          for (let i = 0; i < mem.media.length; i++) {
            const item = mem.media[i];
            const folderKey = item.type === 'video' ? 'video' : item.type === 'audio' ? 'voice' : 'photo';
            counters[folderKey] += 1;

            let repoPath = item.repoPath || '';
            if (!repoPath) {
              let blobToUpload = item.blob instanceof Blob ? item.blob : null;
              if (!blobToUpload && typeof item.src === 'string' && item.src.startsWith('data:')) {
                blobToUpload = dataUrlToBlob(item.src);
              }
              if (blobToUpload) {
                const ext = getExtensionFromMime(item.mimeType || blobToUpload.type, item.type);
                const targetPath = `${memoryFolder}/${folderKey}/${folderKey}-${counters[folderKey]}.${ext}`;
                repoPath = await uploadMediaFileToGitHub(targetPath, blobToUpload);
                item.repoPath = repoPath;
              }
            }

            mediaOut.push({
              type: item.type,
              repoPath: repoPath || item.src || '',
              mimeType: item.mimeType || (item.blob instanceof Blob ? item.blob.type : ''),
              caption: item.caption || ''
            });
          }
        }

        out.push({
          title: mem.title || '',
          date: mem.date || '',
          sathi: mem.sathi || '',
          dipto: mem.dipto || '',
          media: mediaOut,
          locked: Boolean(mem.locked)
        });
      }
      return out;
    }

    async function hydrateMemoriesFromGitHub(remoteMemories) {
      for (let mIdx = 0; mIdx < remoteMemories.length; mIdx++) {
        const remoteMem = remoteMemories[mIdx];
        const localMem = memories[mIdx];
        if (!Array.isArray(remoteMem.media)) {
          remoteMem.media = [];
          continue;
        }
        for (let i = 0; i < remoteMem.media.length; i++) {
          const item = remoteMem.media[i];
          const path = item.repoPath || item.src || '';
          item.repoPath = path;

          const existingLocal = localMem?.media?.find(
            (lm) => lm && lm.repoPath === path && lm.blob instanceof Blob
          );
          if (existingLocal) {
            item.blob = existingLocal.blob;
            item.mimeType = existingLocal.mimeType || existingLocal.blob.type;
          } else if (path && path.startsWith('assets/')) {
            const fetchedBlob = await fetchMediaBlobFromGitHub(path);
            if (fetchedBlob) {
              item.blob = fetchedBlob;
              item.mimeType = item.mimeType || fetchedBlob.type;
            }
          } else if (path.startsWith('data:')) {
            const converted = dataUrlToBlob(path);
            if (converted) {
              item.blob = converted;
              item.mimeType = converted.type;
            }
          }
        }
      }
    }

    async function pullAlbumFromGitHub() {
      if (!isGitHubConfigured() || isGhSyncing) return;
      isGhSyncing = true;
      try {
        const branch = GITHUB_SYNC_CONFIG.branch || 'main';
        const url = `https://api.github.com/repos/${GITHUB_SYNC_CONFIG.repo.trim()}/contents/${GITHUB_SYNC_CONFIG.path.trim()}?ref=${encodeURIComponent(branch)}`;
        const res = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${getActiveGitHubToken()}`,
            'Accept': 'application/vnd.github+json'
          }
        });
        if (res.status === 404) {
          ghLastSha = null;
          isGhSyncing = false;
          await pushAlbumToGitHub();
          return;
        }
        if (!res.ok) throw new Error(`GitHub HTTP ${res.status}`);
        const data = await res.json();
        ghLastSha = data.sha || null;
        if (data.content) {
          const parsed = JSON.parse(base64ToUtf8(data.content));
          if (parsed && Array.isArray(parsed.memories) && parsed.memories.length > 0) {
            await hydrateMemoriesFromGitHub(parsed.memories);
            memories = parsed.memories;
            await idbSet(STORAGE_KEY, memories);
          }
          if (parsed && typeof parsed.secretLoveNote === 'string') {
            secretLoveNote = parsed.secretLoveNote;
            await idbSet(LOVE_NOTE_KEY, secretLoveNote);
          }
          rebuildBookDOM(true);
        }
      } catch (_) {
      } finally {
        isGhSyncing = false;
      }
    }

    async function pushAlbumToGitHub() {
      if (!isGitHubConfigured() || isGhSyncing) return;
      isGhSyncing = true;
      try {
        const repo = GITHUB_SYNC_CONFIG.repo.trim();
        const path = GITHUB_SYNC_CONFIG.path.trim();
        const branch = (GITHUB_SYNC_CONFIG.branch || 'main').trim();
        const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;

        const headRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, {
          headers: {
            'Authorization': `Bearer ${getActiveGitHubToken()}`,
            'Accept': 'application/vnd.github+json'
          }
        });
        if (headRes.ok) {
          const headJson = await headRes.json();
          ghLastSha = headJson.sha || ghLastSha;
        }

        const serializedMemories = await serializeMemoriesForGitHub(memories);
        await idbSet(STORAGE_KEY, memories);

        const payloadObj = {
          updatedAt: new Date().toISOString(),
          secretLoveNote,
          memories: serializedMemories
        };

        const body = {
          message: `Update Dipto & Sathi Memory Book (${new Date().toLocaleDateString()})`,
          content: utf8ToBase64(JSON.stringify(payloadObj, null, 2)),
          branch
        };
        if (ghLastSha) body.sha = ghLastSha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${getActiveGitHubToken()}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        if (putRes.ok) {
          const putJson = await putRes.json();
          ghLastSha = putJson?.content?.sha || ghLastSha;
        }
      } catch (_) {
      } finally {
        isGhSyncing = false;
      }
    }

    let saveDebounceTimer = null;
    async function flushAlbumSave() {
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = null;
      try {
        await idbSet(STORAGE_KEY, memories);
        await idbSet(LOVE_NOTE_KEY, secretLoveNote);
      } catch (_) {
        showToast("Browser storage error — unable to persist memory");
      }
    }

    function saveAlbumData(immediate = false) {
      if (immediate) {
        flushAlbumSave();
        return;
      }
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => {
        flushAlbumSave();
      }, 350);
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function ordinalSuffix(n) {
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${n}th`;
      switch (n % 10) {
        case 1: return `${n}st`;
        case 2: return `${n}nd`;
        case 3: return `${n}rd`;
        default: return `${n}th`;
      }
    }

    function getMilestoneLabel(months) {
      if (months % 12 === 0) {
        const years = months / 12;
        return years === 1 ? 'Happy 1st Anniversary' : `Happy ${ordinalSuffix(years)} Anniversary`;
      }
      if (months % 3 === 0) {
        const quarters = months / 3;
        return quarters === 1 ? 'Happy Quarterversary' : `Happy ${ordinalSuffix(quarters)} Quarterversary`;
      }
      if (months === 1) return 'Happy First Monthsary';
      if (months === 2) return 'Happy Second Monthsary';
      if (months === 3) return 'Happy Third Monthsary';
      return `Happy ${ordinalSuffix(months)} Monthsary`;
    }

    function getRelationshipCounterData() {
      const start = new Date(2026, 9, 19); // 19 Oct 2026
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const msPerDay = 24 * 60 * 60 * 1000;
      const diffDays = Math.max(0, Math.round((today - start) / msPerDay));

      if (today < start) {
        const daysUntil = Math.round((start - today) / msPerDay);
        return {
          days: 0,
          isMilestoneDay: false,
          message: `${daysUntil} ${daysUntil === 1 ? 'day' : 'days'} until our beginning`
        };
      }

      let monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
      const isExactMilestoneDay = today.getDate() === 19 && monthsElapsed >= 1;

      if (isExactMilestoneDay) {
        return {
          days: diffDays,
          isMilestoneDay: true,
          message: `${getMilestoneLabel(monthsElapsed)} ❤️`
        };
      }

      let nextMonthIndex = today.getMonth();
      let nextYear = today.getFullYear();
      if (today.getDate() >= 19) {
        nextMonthIndex += 1;
        if (nextMonthIndex > 11) {
          nextMonthIndex = 0;
          nextYear += 1;
        }
      }
      const nextMilestoneDate = new Date(nextYear, nextMonthIndex, 19);
      const upcomingMonths = (nextYear - start.getFullYear()) * 12 + (nextMonthIndex - start.getMonth());
      const daysLeft = Math.max(1, Math.round((nextMilestoneDate - today) / msPerDay));

      let upcomingTitle = `${ordinalSuffix(upcomingMonths)} Monthsary`;
      if (upcomingMonths % 12 === 0) {
        const yrs = upcomingMonths / 12;
        upcomingTitle = yrs === 1 ? '1st Anniversary' : `${ordinalSuffix(yrs)} Anniversary`;
      } else if (upcomingMonths % 3 === 0) {
        const qtrs = upcomingMonths / 3;
        upcomingTitle = qtrs === 1 ? 'Quarterversary' : `${ordinalSuffix(qtrs)} Quarterversary`;
      }

      return {
        days: diffDays,
        isMilestoneDay: false,
        message: `${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} until ${upcomingTitle}`
      };
    }

    function formatDisplayDate(isoDate) {
      if (!isoDate) return 'Undated';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (Number.isNaN(d.getTime())) return isoDate;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function isOnThisDayMemory(isoDate) {
      if (!isoDate) return false;
      const parts = isoDate.split('-');
      if (parts.length !== 3) return false;
      const now = new Date();
      const m = Number(parts[1]);
      const d = Number(parts[2]);
      return m === (now.getMonth() + 1) && d === now.getDate();
    }

    function getContentsPageCount() {
      const needed = Math.max(1, Math.ceil(memories.length / CONTENTS_PER_PAGE));
      return needed % 2 === 1 ? needed : needed + 1;
    }

    function triggerMemoryHeartPop() {
      const heartEl = document.getElementById('heart-celebration');
      if (!heartEl) return;
      playMemoryBellSound();
      heartEl.classList.remove('hidden', 'heart-celebration-active');
      void heartEl.offsetWidth;
      heartEl.classList.add('heart-celebration-active');
      setTimeout(() => {
        heartEl.classList.add('hidden');
        heartEl.classList.remove('heart-celebration-active');
      }, 760);
    }

    function playMemoryBellSound() {
      if (!config.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = [1046.50, 1318.51, 1567.98]; // C6, E6, G6 crystalline chime
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.055);
          gain.gain.setValueAtTime(0.0001, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.14 / (idx + 1), now + idx * 0.055 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 0.95);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 1.0);
        });
      } catch (_) {}
    }

    function playTurnSound(isHardcover) {
      if (!config.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const duration = isHardcover ? 0.22 : 0.16;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const env = Math.sin((i / bufferSize) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * (isHardcover ? 0.24 : 0.14);
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = isHardcover ? 'lowpass' : 'bandpass';
        filter.frequency.value = isHardcover ? 340 : 1200;
        noise.connect(filter);
        filter.connect(audioCtx.destination);
        noise.start(now);
      } catch (_) {}
    }

    function clearAutoResetTimer() {
      if (autoResetTimer) {
        clearTimeout(autoResetTimer);
        autoResetTimer = null;
      }
    }

    function triggerCascadingRollBack() {
      clearAutoResetTimer();
      destroyRollStage();
      const total = leafNodes.length;
      if (total === 0 || turnedLeaves === 0) return;

      const prevTurned = turnedLeaves;
      turnedLeaves = 0;

      const staggerStep = 0.14;
      const flipDuration = 0.72;
      const maxDelay = Math.max(0, prevTurned - 1) * staggerStep;

      bookStage.style.transition = `transform ${flipDuration}s ease ${(maxDelay * 0.55).toFixed(3)}s`;
      bookStage.style.setProperty('--spine-x', '0px');

      edgeLeft.style.opacity = '0';
      edgeRight.style.opacity = '1';

      leafNodes.forEach((leaf, idx) => {
        leaf.classList.remove('is-dragging');
        const restZ = ((total - idx) * 0.25).toFixed(2);
        if (idx < prevTurned) {
          const reverseIdx = prevTurned - 1 - idx;
          const delay = reverseIdx * staggerStep;
          const midSwapDelay = delay + flipDuration * 0.5;
          leaf.style.zIndex = 200 + reverseIdx;
          leaf.style.transition = `transform ${flipDuration}s ease-in-out ${delay.toFixed(3)}s, z-index 0s ${midSwapDelay.toFixed(3)}s`;
          leaf.style.transform = `translateZ(${restZ}px) rotateY(0deg)`;
          leaf.style.zIndex = 120 - idx;
        } else {
          leaf.style.transition = 'none';
          leaf.style.zIndex = 120 - idx;
          leaf.style.transform = `translateZ(${restZ}px) rotateY(0deg)`;
        }
      });

      playTurnSound(true);
    }

    let isTeleporting = false;
    function animateRollingJumpToLeaf(targetLeaf) {
      const total = leafNodes.length;
      const clampedTarget = Math.max(0, Math.min(total, targetLeaf));
      if (isTeleporting || clampedTarget === turnedLeaves) return;

      clearAutoResetTimer();
      isTeleporting = true;

      function stepNextPage() {
        if (turnedLeaves === clampedTarget) {
          isTeleporting = false;
          return;
        }

        const dir = clampedTarget > turnedLeaves ? 1 : -1;
        const leafIdx = dir === 1 ? turnedLeaves : turnedLeaves - 1;
        const isBoard = (leafIdx === 0 || leafIdx === total - 1);

        if (isBoard) {
          turnedLeaves += dir;
          playTurnSound(true);
          layoutBookAtRest();
          setTimeout(stepNextPage, 260);
          return;
        }

        createPaperRollStage(leafIdx);
        playTurnSound(false);
        const startP = dir === 1 ? 0 : 1;
        const endP = dir === 1 ? 1 : 0;
        const startTime = performance.now();
        const stepDur = 210;

        function animateStep(now) {
          const t = Math.min(1, (now - startTime) / stepDur);
          const ease = 1 - Math.pow(1 - t, 3);
          const curP = startP + (endP - startP) * ease;
          updatePaperRollGeometry(curP, 0.32, 0.92);

          if (t < 1) {
            requestAnimationFrame(animateStep);
          } else {
            turnedLeaves += dir;
            settleFlatLeafWithoutGlitch();
            if (turnedLeaves !== clampedTarget) {
              requestAnimationFrame(stepNextPage);
            } else {
              isTeleporting = false;
            }
          }
        }
        requestAnimationFrame(animateStep);
      }

      stepNextPage();
    }

    function destroyRollStage() {

      activeRollStrips = [];
      leafNodes.forEach((leaf) => {
        leaf.querySelectorAll('.leaf-face').forEach((f) => {
          f.style.visibility = '';
        });
      });
    }

    function sanitizeCloneForRoll(cloneRoot) {
      // Replace heavy live <video> and <audio> decoders inside the 28 cloned roll strips with lightweight static frames
      cloneRoot.querySelectorAll('video').forEach((vid) => {
        const placeholder = document.createElement('div');
        placeholder.className = vid.className + ' bg-stone-900 flex items-center justify-center text-amber-100/80 text-xs';
        placeholder.innerHTML = '<span>▶ Video</span>';
        vid.replaceWith(placeholder);
      });
      cloneRoot.querySelectorAll('audio').forEach((aud) => {
        const bar = document.createElement('div');
        bar.className = 'w-full h-5 rounded bg-amber-200/15 border border-amber-200/25';
        aud.replaceWith(bar);
      });
    }

    function createPaperRollStage(leafIdx) {
      destroyRollStage();
      const leaf = leafNodes[leafIdx];
      if (!leaf) return;

      const frontFace = leaf.querySelector('.leaf-face--front');
      const backFace = leaf.querySelector('.leaf-face--back');
      if (!frontFace || !backFace) return;

      const pageW = bookStage.getBoundingClientRect().width || 300;
      const pageH = bookStage.getBoundingClientRect().height || 420;

      frontFace.querySelectorAll('input').forEach((inp) => inp.setAttribute('value', inp.value));
      frontFace.querySelectorAll('textarea').forEach((ta) => { ta.textContent = ta.value; });
      backFace.querySelectorAll('input').forEach((inp) => inp.setAttribute('value', inp.value));
      backFace.querySelectorAll('textarea').forEach((ta) => { ta.textContent = ta.value; });

      const frontClone = frontFace.cloneNode(true);
      const backClone = backFace.cloneNode(true);
      sanitizeCloneForRoll(frontClone);
      sanitizeCloneForRoll(backClone);

      frontClone.style.transform = 'none';
      frontClone.style.position = 'relative';
      frontClone.style.width = `${pageW}px`;
      frontClone.style.height = `${pageH}px`;

      backClone.style.transform = 'none';
      backClone.style.position = 'relative';
      backClone.style.width = `${pageW}px`;
      backClone.style.height = `${pageH}px`;

      frontFace.style.visibility = 'hidden';
      backFace.style.visibility = 'hidden';

      rollStageEl = document.createElement('div');
      rollStageEl.className = 'paper-roll-stage';
      rollStageEl.style.display = 'block';
      rollStageEl.style.zIndex = '260';
      activeRollStrips = [];

      const stripW = pageW / ROLL_STRIPS;
      let parentContainer = rollStageEl;

      for (let s = 0; s < ROLL_STRIPS; s++) {
        const strip = document.createElement('div');
        strip.className = 'paper-roll-strip';
        strip.dataset.stripIndex = s;
        strip.style.width = `${stripW + 0.6}px`;
        strip.style.left = s === 0 ? '0px' : `${stripW}px`;

        const sFront = document.createElement('div');
        sFront.className = 'paper-roll-strip-front';
        const fInner = document.createElement('div');
        fInner.className = 'paper-roll-strip-inner';
        fInner.style.width = `${pageW}px`;
        fInner.style.left = `${-s * stripW}px`;
        fInner.appendChild(frontClone.cloneNode(true));
        const fShade = document.createElement('div');
        fShade.className = 'paper-roll-shade';
        sFront.appendChild(fInner);
        sFront.appendChild(fShade);

        const sBack = document.createElement('div');
        sBack.className = 'paper-roll-strip-back';
        const bInner = document.createElement('div');
        bInner.className = 'paper-roll-strip-inner';
        bInner.style.width = `${pageW}px`;
        bInner.style.left = `${-(ROLL_STRIPS - 1 - s) * stripW}px`;
        bInner.appendChild(backClone.cloneNode(true));
        const bShade = document.createElement('div');
        bShade.className = 'paper-roll-shade';
        sBack.appendChild(bInner);
        sBack.appendChild(bShade);

        strip.appendChild(sFront);
        strip.appendChild(sBack);
        parentContainer.appendChild(strip);
        parentContainer = strip;

        activeRollStrips.push({ el: strip, fShade, bShade });
      }

      bookStage.appendChild(rollStageEl);
    }

    function updatePaperRollGeometry(effectiveP, grabNormY, grabNormX) {
      if (!rollStageEl || activeRollStrips.length === 0) return;

      const cornerBias = (grabNormY - 0.5) * 2;
      const absCorner = Math.abs(cornerBias);
      const isCenterGrab = grabNormX < 0.58;
      const archEnvelope = Math.sin(effectiveP * Math.PI);

      const diagonalTiltX = -cornerBias * 16 * archEnvelope;
      const diagonalSkewY = cornerBias * 6.5 * archEnvelope;
      const liftZ = 4 + (isCenterGrab ? 18 : 10) * archEnvelope;

      rollStageEl.style.transform = `translateZ(${liftZ.toFixed(1)}px) rotateX(${diagonalTiltX.toFixed(2)}deg) skewY(${diagonalSkewY.toFixed(2)}deg)`;

      const baseAngle = -180 * effectiveP;
      const len = activeRollStrips.length;

      for (let idx = 0; idx < len; idx++) {
        const { el: strip, fShade, bShade } = activeRollStrips[idx];
        const u = idx / (ROLL_STRIPS - 1);
        let localCurl = 0;

        if (idx === 0) {
          const spineLag = isCenterGrab ? 0.82 : (1 - 0.25 * archEnvelope);
          localCurl = baseAngle * spineLag;
        } else {
          const wave = Math.sin(effectiveP * Math.PI);
          const edgeWeight = Math.pow(u, 0.8);
          const cornerLead = (1 + absCorner * 0.55) * edgeWeight;
          const centerDome = isCenterGrab ? Math.sin(u * Math.PI) * 22 * wave : 0;

          if (effectiveP <= 0.5) {
            localCurl = -(19 * wave * cornerLead) + centerDome;
          } else {
            const settle = (1 - effectiveP) * 2;
            localCurl = -(16 * settle * cornerLead) - ((180 + baseAngle * (isCenterGrab ? 0.82 : (1 - 0.25 * archEnvelope))) / (ROLL_STRIPS - 1));
          }
        }

        strip.style.transform = `rotateY(${localCurl.toFixed(2)}deg)`;

        const highlight = Math.max(0, Math.sin(u * Math.PI) * archEnvelope * 0.28);
        const creaseShadow = Math.max(0, (1 - u) * archEnvelope * 0.24);
        fShade.style.background = `linear-gradient(90deg, rgba(25,14,6,${creaseShadow.toFixed(3)}), rgba(255,253,246,${highlight.toFixed(3)}))`;
        bShade.style.background = `linear-gradient(270deg, rgba(25,14,6,${creaseShadow.toFixed(3)}), rgba(255,253,246,${highlight.toFixed(3)}))`;
      }
    }

    function isInteractiveTarget(target) {
      return Boolean(
        target.closest('input, textarea, button, label, [data-lightbox-mem], [data-jump-leaf], #secret-love-envelope, #secret-love-letter-card')
      );
    }

    deskScene.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      if (isInteractiveTarget(e.target)) return;
      if (config.soundEnabled && (!isBgMusicActive || (bgMusicAudio && bgMusicAudio.paused))) startBgMusic();

      clearAutoResetTimer();
      const rect = bookStage.getBoundingClientRect();

      gesture.active = true;
      gesture.pointerId = e.pointerId;
      gesture.startX = e.clientX;
      gesture.startY = e.clientY;
      gesture.dir = 0;
      gesture.leafIdx = -1;
      gesture.progress = 0;
      gesture.grabNormY = Math.max(0, Math.min(1, (e.clientY - rect.top) / (rect.height || 1)));
      gesture.grabNormX = Math.max(0, Math.min(1, Math.abs(e.clientX - rect.left) / (rect.width || 1)));
      gesture.startedOutsideBook = !e.target.closest('#book-stage');

      try { deskScene.setPointerCapture(e.pointerId); } catch (_) {}
    });

    deskScene.addEventListener('pointermove', (e) => {
      if (!gesture.active || e.pointerId !== gesture.pointerId) return;
      latestMoveSample = { clientX: e.clientX };
      if (moveRafPending) return;
      moveRafPending = true;

      requestAnimationFrame(() => {
        moveRafPending = false;
        if (!gesture.active || !latestMoveSample) return;

        const dx = latestMoveSample.clientX - gesture.startX;
        const totalLeaves = leafNodes.length;

        if (gesture.dir === 0) {
          if (Math.abs(dx) < 6) return;
          if (dx < 0 && turnedLeaves < totalLeaves) {
            gesture.dir = 1;
            gesture.leafIdx = turnedLeaves;
          } else if (dx > 0 && turnedLeaves > 0) {
            gesture.dir = -1;
            gesture.leafIdx = turnedLeaves - 1;
          } else {
            return;
          }

          const activeLeaf = leafNodes[gesture.leafIdx];
          const isBoard = (gesture.leafIdx === 0 || gesture.leafIdx === totalLeaves - 1);
          if (activeLeaf) {
            activeLeaf.classList.add('is-dragging');
            activeLeaf.style.transition = 'none';
            activeLeaf.style.zIndex = 250;
          }
          bookStage.style.transition = 'none';

          if (!isBoard) {
            createPaperRollStage(gesture.leafIdx);
          }
        }

        const activeLeaf = leafNodes[gesture.leafIdx];
        if (!activeLeaf) return;

        const pageW = bookStage.getBoundingClientRect().width || 300;
        const dragDistance = pageW * 1.15;

        const p = gesture.dir === 1
          ? Math.max(0, Math.min(1, -dx / dragDistance))
          : Math.max(0, Math.min(1, dx / dragDistance));

        gesture.progress = p;
        const effectiveP = gesture.dir === 1 ? p : (1 - p);
        const isBoard = (gesture.leafIdx === 0 || gesture.leafIdx === totalLeaves - 1);

        if (isBoard) {
          const angle = -180 * effectiveP;
          activeLeaf.style.transform = `translateZ(2px) rotateY(${angle.toFixed(2)}deg)`;

          if (gesture.leafIdx === 0) {
            const startShift = getSpineShiftForState(0, totalLeaves);
            const endShift = getSpineShiftForState(1, totalLeaves);
            bookStage.style.setProperty('--spine-x', `${startShift + (endShift - startShift) * effectiveP}px`);
          } else if (gesture.leafIdx === totalLeaves - 1) {
            const startShift = getSpineShiftForState(totalLeaves - 1, totalLeaves);
            const endShift = getSpineShiftForState(totalLeaves, totalLeaves);
            bookStage.style.setProperty('--spine-x', `${startShift + (endShift - startShift) * effectiveP}px`);
          }
        } else {
          updatePaperRollGeometry(effectiveP, gesture.grabNormY, gesture.grabNormX);
        }
      });
    });

    function finishGesture() {
      if (!gesture.active) return;
      const wasTapOutside = gesture.dir === 0 && gesture.startedOutsideBook;
      gesture.active = false;
      moveRafPending = false;
      latestMoveSample = null;
      try {
        if (gesture.pointerId !== null) deskScene.releasePointerCapture(gesture.pointerId);
      } catch (_) {}
      gesture.pointerId = null;

      if (gesture.dir === 0 || gesture.leafIdx < 0) {
        if (wasTapOutside && turnedLeaves > 0) {
          triggerCascadingRollBack();
        }
        return;
      }

      const totalLeaves = leafNodes.length;
      const isBoard = (gesture.leafIdx === 0 || gesture.leafIdx === totalLeaves - 1);
      const completed = gesture.progress > 0.22;

      if (completed) {
        playTurnSound(isBoard);
        if (gesture.dir === 1 && turnedLeaves < totalLeaves) {
          turnedLeaves += 1;
        } else if (gesture.dir === -1 && turnedLeaves > 0) {
          turnedLeaves -= 1;
        }
      }

      if (!isBoard && rollStageEl) {
        const targetP = completed ? (gesture.dir === 1 ? 1 : 0) : (gesture.dir === 1 ? 0 : 1);
        const startP = gesture.dir === 1 ? gesture.progress : (1 - gesture.progress);
        const startTime = performance.now();
        const animDur = 240;

        function animateRollFinish(now) {
          const t = Math.min(1, (now - startTime) / animDur);
          const ease = 1 - Math.pow(1 - t, 3);
          const curP = startP + (targetP - startP) * ease;
          updatePaperRollGeometry(curP, gesture.grabNormY, gesture.grabNormX);
          if (t < 1) {
            requestAnimationFrame(animateRollFinish);
          } else {
            settleFlatLeafWithoutGlitch();
          }
        }
        requestAnimationFrame(animateRollFinish);
      } else {
        destroyRollStage();
        layoutBookAtRest();
        clearAutoResetTimer();
        if (turnedLeaves >= totalLeaves) {
          autoResetTimer = setTimeout(() => {
            triggerCascadingRollBack();
          }, 1550);
        }
      }
    }

    deskScene.addEventListener('pointerup', finishGesture);
    deskScene.addEventListener('pointercancel', finishGesture);

    const confirmModal = document.getElementById('confirm-modal');
    const confirmTitleEl = document.getElementById('confirm-title');
    const confirmMessageEl = document.getElementById('confirm-message');
    const confirmCancelBtn = document.getElementById('confirm-cancel-btn');
    const confirmProceedBtn = document.getElementById('confirm-proceed-btn');
    let pendingConfirmAction = null;

    function openConfirmWarning(title, message, onConfirm) {
      confirmTitleEl.textContent = title;
      confirmMessageEl.textContent = message;
      pendingConfirmAction = onConfirm;
      confirmModal.classList.remove('hidden');
      confirmModal.classList.add('flex');
    }

    function closeConfirmWarning() {
      pendingConfirmAction = null;
      confirmModal.classList.add('hidden');
      confirmModal.classList.remove('flex');
    }

    confirmCancelBtn.addEventListener('click', closeConfirmWarning);
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) closeConfirmWarning();
    });
    confirmProceedBtn.addEventListener('click', () => {
      const fn = pendingConfirmAction;
      closeConfirmWarning();
      if (typeof fn === 'function') fn();
    });

    function getSpineShiftForState(turned, total) {
      const pageW = bookStage.getBoundingClientRect().width || 300;
      if (turned <= 0) return 0;
      if (turned >= total) return pageW;
      return pageW * 0.5;
    }

    function layoutBookAtRest(instant = false) {
      const total = leafNodes.length;
      if (total === 0) return;

      const anim = instant ? 'none' : 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
      bookStage.style.transition = anim;
      bookStage.style.setProperty('--spine-x', `${getSpineShiftForState(turnedLeaves, total)}px`);

      edgeLeft.style.opacity = turnedLeaves > 1 && turnedLeaves < total ? '1' : '0';
      edgeRight.style.opacity = turnedLeaves < total - 1 ? '1' : '0';

      leafNodes.forEach((leaf, idx) => {
        leaf.classList.remove('is-dragging');
        leaf.style.transition = anim;
        if (idx < turnedLeaves) {
          leaf.style.zIndex = 20 + idx;
          leaf.style.transform = `translateZ(${(idx * 0.25).toFixed(2)}px) rotateY(-180deg)`;
        } else {
          leaf.style.zIndex = 120 - idx;
          leaf.style.transform = `translateZ(${((total - idx) * 0.25).toFixed(2)}px) rotateY(0deg)`;
        }
      });
    }

    function settleFlatLeafWithoutGlitch() {
      const total = leafNodes.length;
      bookStage.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
      bookStage.style.setProperty('--spine-x', `${getSpineShiftForState(turnedLeaves, total)}px`);

      edgeLeft.style.opacity = turnedLeaves > 1 && turnedLeaves < total ? '1' : '0';
      edgeRight.style.opacity = turnedLeaves < total - 1 ? '1' : '0';

      leafNodes.forEach((leaf, idx) => {
        leaf.classList.remove('is-dragging');
        leaf.style.transition = 'none';
        if (idx < turnedLeaves) {
          leaf.style.zIndex = 20 + idx;
          leaf.style.transform = `translateZ(${(idx * 0.25).toFixed(2)}px) rotateY(-180deg)`;
        } else {
          leaf.style.zIndex = 120 - idx;
          leaf.style.transform = `translateZ(${((total - idx) * 0.25).toFixed(2)}px) rotateY(0deg)`;
        }
      });

      void bookStage.offsetWidth;
      destroyRollStage();

      clearAutoResetTimer();
      if (turnedLeaves >= total) {
        autoResetTimer = setTimeout(() => {
          triggerCascadingRollBack();
        }, 950);
      }
    }

      backCoverLeaf.innerHTML = `
