    const activeVoiceRecorder = {
      memIdx: null,
      recorder: null,
      chunks: [],
      stream: null
    };

    async function toggleVoiceRecording(memIdx) {
      if (activeVoiceRecorder.recorder && activeVoiceRecorder.memIdx === memIdx) {
        activeVoiceRecorder.recorder.stop();
        return;
      }
      if (activeVoiceRecorder.recorder) {
        activeVoiceRecorder.recorder.stop();
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        activeVoiceRecorder.memIdx = memIdx;
        activeVoiceRecorder.recorder = recorder;
        activeVoiceRecorder.chunks = [];
        activeVoiceRecorder.stream = stream;

        recorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) activeVoiceRecorder.chunks.push(ev.data);
        };

        recorder.onstop = () => {
          const targetIdx = activeVoiceRecorder.memIdx;
          const blob = new Blob(activeVoiceRecorder.chunks, { type: recorder.mimeType || 'audio/webm' });
          if (activeVoiceRecorder.stream) {
            activeVoiceRecorder.stream.getTracks().forEach(t => t.stop());
          }
          activeVoiceRecorder.memIdx = null;
          activeVoiceRecorder.recorder = null;
          activeVoiceRecorder.chunks = [];
          activeVoiceRecorder.stream = null;

          if (memories[targetIdx]) {
            if (!Array.isArray(memories[targetIdx].media)) memories[targetIdx].media = [];
            memories[targetIdx].media.push({
              type: 'audio',
              blob,
              mimeType: blob.type,
              caption: 'Our Voices ♥'
            });
            saveAlbumData(true);
            refreshMemorySpreadDOM(targetIdx);
            showToast('Voice note saved to memory!');
          }
        };

        recorder.start();
        refreshMemorySpreadDOM(memIdx);
        showToast('Recording voices... Tap "Stop & Save" when done');
      } catch (_) {
        showToast('Microphone access denied or unavailable');
      }
    }

    bookStage.addEventListener('click', (e) => {
      const letterCardEl = e.target.closest('#secret-love-letter-card');
      if (letterCardEl && isEnvelopeOpen) {
        e.stopPropagation();
        const noteModal = document.getElementById('love-note-modal');
        const noteDisplay = document.getElementById('love-note-display');
        if (noteDisplay) noteDisplay.textContent = secretLoveNote;
        if (noteModal) {
          noteModal.classList.remove('hidden');
          noteModal.classList.add('flex');
        }
        return;
      }

      const envelopeEl = e.target.closest('#secret-love-envelope');
      if (envelopeEl) {
        e.stopPropagation();
        if (!isEnvelopeOpen) {
          isEnvelopeOpen = true;
          envelopeEl.classList.add('is-open');
          const badge = envelopeEl.querySelector('span');
          if (badge) badge.textContent = 'Click to read more';
          playTurnSound(false);
        } else {
          const noteModal = document.getElementById('love-note-modal');
          const noteDisplay = document.getElementById('love-note-display');
          if (noteDisplay) noteDisplay.textContent = secretLoveNote;
          if (noteModal) {
            noteModal.classList.remove('hidden');
            noteModal.classList.add('flex');
          }
        }
        return;
      }

      const voiceBtn = e.target.closest('[data-voice-record-mem]');
      if (voiceBtn) {
        e.stopPropagation();
        const memIdx = Number(voiceBtn.dataset.voiceRecordMem);
        if (!Number.isNaN(memIdx)) toggleVoiceRecording(memIdx);
        return;
      }

      const lockToggleBtn = e.target.closest('[data-toggle-lock-mem]');
      if (lockToggleBtn) {
        e.stopPropagation();
        const memIdx = Number(lockToggleBtn.dataset.toggleLockMem);
        const mem = memories[memIdx];
        if (!mem) return;

        if (!mem.locked) {
          mem.locked = true;
          saveAlbumData(true);
          refreshMemorySpreadDOM(memIdx);
          refreshAllContentsContainers();
          triggerMemoryHeartPop();
          pushAlbumToGitHub();
        } else {
          mem.locked = false;
          saveAlbumData(true);
          refreshMemorySpreadDOM(memIdx);
          refreshAllContentsContainers();
          showToast("Memory unlocked for editing");
        }
        return;
      }

      const addBtn = e.target.closest('#add-new-page-btn');
      if (addBtn) {
        e.stopPropagation();
        const prevContentsCount = getContentsPageCount();
        memories.push({
          title: "",
          date: "",
          sathi: "",
          dipto: "",
          media: [],
          locked: false
        });
        const newContentsCount = getContentsPageCount();
        if (newContentsCount > prevContentsCount) {
          turnedLeaves += (newContentsCount - prevContentsCount) / 2;
        }
        saveAlbumData(true);
        rebuildBookDOM(true);
        playTurnSound(false);
        showToast(`Added Memory ${memories.length < 10 ? '0' + memories.length : memories.length}`);
        return;
      }

      const jumpBtn = e.target.closest('[data-jump-leaf]');
      if (jumpBtn) {
        e.stopPropagation();
        const targetLeaf = Number(jumpBtn.dataset.jumpLeaf);
        if (!Number.isNaN(targetLeaf)) {
          animateRollingJumpToLeaf(targetLeaf);
        }
        return;
      }

      const clearBtn = e.target.closest('[data-clear-text-mem]');
      if (clearBtn) {
        e.stopPropagation();
        const memIdx = Number(clearBtn.dataset.clearTextMem);
        const field = clearBtn.dataset.clearTextField;
        const mem = memories[memIdx];
        if (!mem || !mem[field] || !mem[field].trim()) {
          showToast("Nothing to clear yet");
          return;
        }
        const who = field === 'sathi' ? "Sathi’s" : "Dipto’s";
        openConfirmWarning(
          `Clear ${who} Feelings?`,
          `Are you sure you want to delete everything written in ${who} section on this page? This cannot be undone.`,
          () => {
            memories[memIdx][field] = "";
            saveAlbumData(true);
            refreshMemorySpreadDOM(memIdx);
            showToast(`${who} feelings cleared`);
          }
        );
        return;
      }

      const cardTrigger = e.target.closest('[data-lightbox-mem]');
      if (cardTrigger) {
        e.stopPropagation();
        const memIdx = Number(cardTrigger.dataset.lightboxMem);
        const mediaIdx = Number(cardTrigger.dataset.lightboxIdx);
        const mem = memories[memIdx];
        if (!mem || !mem.media || !mem.media[mediaIdx]) return;

        const item = mem.media[mediaIdx];
        const mediaSrc = getMediaObjectUrl(item);
        lightboxTarget = { memIdx, mediaIdx };
        if (item.type === 'video') {
          modalMediaHolder.innerHTML = `<video src="${mediaSrc}" controls autoplay class="w-full max-h-[65vh] rounded bg-black"></video>`;
        } else if (item.type === 'audio') {
          modalMediaHolder.innerHTML = `
            <div class="w-full p-6 bg-gradient-to-br from-rose-950 to-amber-950 text-amber-100 flex flex-col items-center gap-3 rounded">
              <span class="font-serif-editorial italic text-xl">🎙️ Voice Memory</span>
              <audio src="${mediaSrc}" controls autoplay class="w-full"></audio>
            </div>`;
        } else {
          modalMediaHolder.innerHTML = `<img src="${mediaSrc}" alt="Memory" class="w-full max-h-[65vh] object-contain rounded" />`;
        }

        modalMediaCaption.textContent = item.caption?.trim() || `${mem.title || 'Memory ' + (memIdx + 1)} — #${mediaIdx + 1}`;
        deleteMediaBtn.classList.toggle('hidden', Boolean(mem.locked));
        mediaModal.classList.remove('hidden');
        mediaModal.classList.add('flex');
      }
    });

    bookStage.addEventListener('input', (e) => {
      const target = e.target;

      if (target.dataset.captionMem !== undefined) {
        const memIdx = Number(target.dataset.captionMem);
        const mediaIdx = Number(target.dataset.captionIdx);
        if (memories[memIdx] && !memories[memIdx].locked && memories[memIdx].media && memories[memIdx].media[mediaIdx]) {
          memories[memIdx].media[mediaIdx].caption = target.value;
          saveAlbumData();
        }
        return;
      }

      const field = target.dataset.memField;
      const memIdx = Number(target.dataset.memIdx);
      if (!field || Number.isNaN(memIdx) || !memories[memIdx] || memories[memIdx].locked) return;

      memories[memIdx][field] = target.value;
      saveAlbumData();

      if (field === 'title' || field === 'date') {
        refreshAllContentsContainers();
        if (field === 'date') {
          refreshMemorySpreadDOM(memIdx);
        }
      }
    });

    function compressImageFileToBlob(file) {
      return new Promise((resolve) => {
        const tempUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const maxDim = 1080;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          c.toBlob((blob) => {
            URL.revokeObjectURL(tempUrl);
            resolve(blob || file);
          }, 'image/jpeg', 0.85);
        };
        img.onerror = () => {
          URL.revokeObjectURL(tempUrl);
          resolve(file);
        };
        img.src = tempUrl;
      });
    }

    bookStage.addEventListener('change', async (e) => {
      const input = e.target;
      if (!input.matches('input[data-media-upload]')) return;

      const memIdx = Number(input.dataset.mediaUpload);
      const files = Array.from(input.files || []);
      if (files.length === 0 || !memories[memIdx]) return;

      if (!Array.isArray(memories[memIdx].media)) memories[memIdx].media = [];
      for (const file of files) {
        if (file.type.startsWith('video/')) {
          memories[memIdx].media.push({
            type: 'video',
            blob: file,
            mimeType: file.type,
            caption: ''
          });
        } else {
          const imgBlob = await compressImageFileToBlob(file);
          memories[memIdx].media.push({
            type: 'image',
            blob: imgBlob,
            mimeType: imgBlob.type || 'image/jpeg',
            caption: ''
          });
        }
      }

      saveAlbumData(true);
      const grid = bookStage.querySelector(`.media-grid-container[data-media-mem="${memIdx}"]`);
      if (grid) {
        grid.innerHTML = renderMediaInnerHTML(memIdx, memories[memIdx].media, Boolean(memories[memIdx].locked));
      }
      input.value = '';
      showToast(`Added ${files.length} item${files.length > 1 ? 's' : ''}`);
    });

    const mediaModal = document.getElementById('media-modal');
    const modalMediaHolder = document.getElementById('modal-media-holder');
    const modalMediaCaption = document.getElementById('modal-media-caption');
    const deleteMediaBtn = document.getElementById('delete-media-btn');
    let lightboxTarget = { memIdx: null, mediaIdx: null };

    function closeMediaLightbox() {
      modalMediaHolder.innerHTML = '';
      mediaModal.classList.add('hidden');
      mediaModal.classList.remove('flex');
      lightboxTarget = { memIdx: null, mediaIdx: null };
    }

    document.getElementById('close-media-modal').addEventListener('click', closeMediaLightbox);
    mediaModal.addEventListener('click', (e) => {
      if (e.target === mediaModal) closeMediaLightbox();
    });

    deleteMediaBtn.addEventListener('click', () => {
      const { memIdx, mediaIdx } = lightboxTarget;
      if (memIdx === null || mediaIdx === null) return;
      const item = memories[memIdx]?.media?.[mediaIdx];
      const kind = item?.type === 'video' ? 'video' : item?.type === 'audio' ? 'voice note' : 'photo';

      openConfirmWarning(
        `Delete this ${kind}?`,
        `Are you sure you want to permanently remove this ${kind} and its caption from the album?`,
        () => {
          if (memories[memIdx] && memories[memIdx].media) {
            memories[memIdx].media.splice(mediaIdx, 1);
            saveAlbumData(true);
            const grid = bookStage.querySelector(`.media-grid-container[data-media-mem="${memIdx}"]`);
            if (grid) {
              grid.innerHTML = renderMediaInnerHTML(memIdx, memories[memIdx].media, Boolean(memories[memIdx].locked));
            }
            showToast(`${kind.charAt(0).toUpperCase() + kind.slice(1)} removed`);
          }
          closeMediaLightbox();
        }
      );
    });

    let toastTimer = null;
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = msg;
      banner.classList.remove('opacity-0', 'translate-y-3');
      banner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('opacity-0', 'translate-y-3');
        banner.classList.remove('opacity-100', 'translate-y-0');
      }, 2600);
    }

    const soundToggle = document.getElementById('sound-toggle');
    const soundIconOn = document.getElementById('sound-icon-on');
    const soundIconOff = document.getElementById('sound-icon-off');

    function syncSoundIcon() {
      soundIconOn.classList.toggle('hidden', !config.soundEnabled);
      soundIconOff.classList.toggle('hidden', config.soundEnabled);
    }
    syncSoundIcon();

    soundToggle.addEventListener('click', () => {
      config.soundEnabled = !config.soundEnabled;
      saveConfig();
      syncSoundIcon();
      if (config.soundEnabled) {
        playTurnSound(false);
        startBgMusic();
      } else {
        stopBgMusic();
      }
    });

    const loveNoteModal = document.getElementById('love-note-modal');

    function closeLoveNoteModal() {
      loveNoteModal.classList.add('hidden');
      loveNoteModal.classList.remove('flex');
      isEnvelopeOpen = false;
      const env = bookStage.querySelector('#secret-love-envelope');
      if (env) {
        env.classList.remove('is-open');
        const badge = env.querySelector('span');
        if (badge) badge.textContent = 'Tap to open envelope';
      }
      const peek = bookStage.querySelector('#secret-love-letter-card p');
      if (peek) {
        peek.textContent = (secretLoveNote || '').slice(0, 92) + ((secretLoveNote || '').length > 92 ? '...' : '');
      }
    }

    document.getElementById('close-love-note-modal').addEventListener('click', closeLoveNoteModal);
    document.getElementById('done-love-note-btn').addEventListener('click', closeLoveNoteModal);
    loveNoteModal.addEventListener('click', (e) => {
      if (e.target === loveNoteModal) closeLoveNoteModal();
    });

    window.addEventListener('resize', () => {
      layoutBookAtRest();
    });

    window.onload = async function () {
      await loadAlbumFromStorage();
      rebuildBookDOM();
      if (isGitHubConfigured()) {
        pullAlbumFromGitHub();
      }
    };
  </script>
</body>
</html>
